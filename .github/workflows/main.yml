name: Build Tbe3ni APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Tbe3ni project
        run: |
          unzip -q Tbe3ni_Android_v1.1.zip
          cp -r Tbe3ni_Android/. .
          rm -rf Tbe3ni_Android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tbe3ni-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
